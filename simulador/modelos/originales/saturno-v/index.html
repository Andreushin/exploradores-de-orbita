<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Apolo 11 / Saturno V - Portal de Visualización 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .title-group p {
      font-size: 11px;
      color: #94a3b8;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .tab-nav {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      color: #fff;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .ext-link {
      color: #38bdf8;
      font-size: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'SF Mono', Consolas, monospace;
      padding: 6px 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      transition: background 0.2s;
    }
    .ext-link:hover {
      background: rgba(56, 189, 248, 0.15);
    }
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge">NASA · APOLLO 11</div>
      <div class="title-group">
        <h1>Saturno V & Módulo Lunar Eagle</h1>
        <p>1969 MANNED LUNAR LANDING · 110.6M · 3,000 T</p>
      </div>
    </div>

    <nav class="tab-nav">
      <button class="tab-btn active" onclick="switchView('apollo11-assembled.html', this)">
        🚀 Cohete Completo Ensamblado
      </button>
      <button class="tab-btn" onclick="switchView('apollo11-exploded.html', this)">
        🧩 Despiece Interactivo (Por Partes)
      </button>
    </nav>

    <div class="actions">
      <a id="btn-open-ext" class="ext-link" href="apollo11-assembled.html" target="_blank">
        ↗ Abrir en Pantalla Completa
      </a>
    </div>
  </header>

  <main>
    <iframe id="viewer-frame" src="apollo11-assembled.html"></iframe>
  </main>

  <script>
    function switchView(url, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('viewer-frame').src = url;
      document.getElementById('btn-open-ext').href = url;
    }
  </script>
</body>
</html>
