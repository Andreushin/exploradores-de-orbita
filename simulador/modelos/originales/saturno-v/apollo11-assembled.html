<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Apolo 11 / Saturno V - Cohete Completo Ensamblado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* HUD Superior */
    #hud {
      position: fixed; top: 24px; left: 28px;
      z-index: 10; pointer-events: none;
    }
    .hud-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 9999px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 9px; letter-spacing: 0.18em;
      color: #bae6fd; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .hud-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #38bdf8; box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 24px; font-weight: 800;
      color: #f8fafc; letter-spacing: -0.02em;
    }
    .hud-sub {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.15em; margin-top: 2px;
    }

    /* Telemetría Histórica */
    #telemetry-box {
      position: fixed; top: 24px; right: 28px;
      z-index: 10; pointer-events: none;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px; padding: 12px 18px;
      display: flex; gap: 20px;
    }
    .telem-item { text-align: right; }
    .telem-label {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 8px; color: rgba(255,255,255,0.45);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .telem-val {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 13px; font-weight: 700; color: #38bdf8; margin-top: 2px;
    }

    /* Barra de Control Inferior */
    #controls-bar {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 7px 15px; border-radius: 20px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(56,189,248,0.3); border-color: #38bdf8; }
    .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 700; box-shadow: 0 0 15px rgba(2,132,199,0.6); }

    /* Cámaras Predefinidas */
    #cam-bar {
      position: fixed; left: 28px; bottom: 24px;
      z-index: 10; display: flex; flex-direction: column; gap: 6px;
    }
    .cam-btn {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px; border-radius: 8px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 9px;
      color: #cbd5e1; cursor: pointer; transition: all 0.2s;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .cam-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
    .cam-btn.active { background: rgba(56,189,248,0.3); border-color: #38bdf8; color: #bae6fd; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="hud">
    <div class="hud-badge">
      <span class="hud-dot"></span>
      <span>NASA APOLLO 11 · SATURN V LAUNCH VEHICLE</span>
    </div>
    <div class="hud-title">Saturno V Completo Ensamblado (Apolo 11)</div>
    <div class="hud-sub">CONFIGURACIÓN DE LANZAMIENTO LUNAR · ARRASTRA PARA ROTAR</div>
  </div>

  <div id="telemetry-box">
    <div class="telem-item">
      <div class="telem-label">EMPUJE TOTAL</div>
      <div class="telem-val">34.5 MN</div>
    </div>
    <div class="telem-item">
      <div class="telem-label">ALTURA TOTAL</div>
      <div class="telem-val">110.6 METROS</div>
    </div>
    <div class="telem-item">
      <div class="telem-label">PESO AL DESPEGUE</div>
      <div class="telem-val">2,970 TONS</div>
    </div>
  </div>

  <div id="cam-bar">
    <button class="cam-btn active" data-cam="global">Vista Global</button>
    <button class="cam-btn" data-cam="apollo">Apolo 11 (CSM)</button>
    <button class="cam-btn" data-cam="s2">Etapas S-II / S-IVB</button>
    <button class="cam-btn" data-cam="engines">Motores F-1</button>
  </div>

  <div id="controls-bar">
    <button class="btn" id="btn-ignite">🔥 Encender Motores F-1</button>
    <button class="btn" id="btn-rotate">Rotación Automática</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── 1. WebGL Renderer & Escena ───────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2.0));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(24, 4, 30);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.5, 0);
    controls.maxDistance = 85;
    controls.minDistance = 6;

    // ── 2. Iluminación Espacial y Reflejos ────────────────────────────────────
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff8ee, 2.4);
    sunLight.position.set(30, 45, 25);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.1);
    rimLight.position.set(-25, -10, -25);
    scene.add(rimLight);

    const engineLight = new THREE.PointLight(0xff7700, 0, 50);
    engineLight.position.set(0, -9.5, 0);
    scene.add(engineLight);

    // Fondo estelar
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<4500; i++) {
      starPos.push((Math.random()-0.5)*350, (Math.random()-0.5)*350, (Math.random()-0.5)*350);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.65, color: 0xffffff, transparent: true, opacity: 0.65 });
    scene.add(new THREE.Points(starGeo, starMat));

    // ── 3. Generación Procedural de Texturas Saturno V ────────────────────────
    function createTexture(w, h, drawFn) {
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      drawFn(ctx, w, h);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function drawFlag(ctx, x, y, w, h) {
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(x, y, w, h);
      const stripeH = h / 7;
      ctx.fillStyle = '#ffffff';
      for(let s = 1; s < 7; s += 2) ctx.fillRect(x, y + s * stripeH, w, stripeH);
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(x, y, w * 0.45, h * 0.55);
      ctx.fillStyle = '#ffffff';
      for(let r = 0; r < 3; r++) {
        for(let c = 0; c < 4; c++) ctx.fillRect(x + 4 + c * 8, y + 3 + r * 6, 2, 2);
      }
    }

    const s1cTex = createTexture(1024, 2048, (ctx, w, h) => {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w * 0.25, 280);
      ctx.fillRect(w * 0.5, 0, w * 0.25, 280);
      ctx.fillRect(0, 1150, w * 0.25, 480);
      ctx.fillRect(w * 0.5, 1150, w * 0.25, 480);

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 720, w, 280);
      ctx.fillStyle = '#cbd5e1';
      for(let x = 0; x < w; x += 12) ctx.fillRect(x, 720, 6, 280);

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 720); ctx.lineTo(w, 720); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 1000); ctx.lineTo(w, 1000); ctx.stroke();

      drawFlag(ctx, 380, 420, 160, 95);
      drawFlag(ctx, 890, 420, 160, 95);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 96px Arial, Helvetica, sans-serif';
      ctx.letterSpacing = '14px';
      ctx.fillText('U', 380, 1260); ctx.fillText('S', 380, 1370); ctx.fillText('A', 380, 1480);
      ctx.fillText('U', 890, 1260); ctx.fillText('S', 890, 1370); ctx.fillText('A', 890, 1480);
    });

    const s2Tex = createTexture(1024, 1024, (ctx, w, h) => {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w * 0.25, 200);
      ctx.fillRect(w * 0.5, 0, w * 0.25, 200);

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 800, w, 224);
      ctx.fillStyle = '#cbd5e1';
      for(let x = 0; x < w; x += 12) ctx.fillRect(x, 800, 6, 224);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 36px Arial, Helvetica, sans-serif';
      ctx.letterSpacing = '8px';
      ctx.save(); ctx.translate(380, 320); ctx.rotate(Math.PI / 2); ctx.fillText('UNITED STATES', 0, 0); ctx.restore();
      ctx.save(); ctx.translate(890, 320); ctx.rotate(Math.PI / 2); ctx.fillText('UNITED STATES', 0, 0); ctx.restore();
    });

    const s4bTex = createTexture(1024, 1024, (ctx, w, h) => {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 480, w, 36);

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      for(let x = 0; x < w; x += 256) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 480); ctx.stroke();
      }

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 28px Arial, sans-serif';
      ctx.fillText('USA', 320, 720);
      drawFlag(ctx, 580, 680, 80, 50);
    });

    const csmTex = createTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1e293b';
      for(let i=0; i<4; i++) {
        ctx.fillRect(i * 256 + 32, 60, 192, 380);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for(let l = 75; l < 430; l += 20) {
          ctx.beginPath(); ctx.moveTo(i*256 + 32, l); ctx.lineTo(i*256 + 224, l); ctx.stroke();
        }
      }
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('APOLLO 11 · CSM-107', 350, 40);
    });

    // ── 4. Construcción del Saturno V Completo Ensamblado ─────────────────────
    const rocket = new THREE.Group();
    scene.add(rocket);

    const matWhite  = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35, metalness: 0.1 });
    const matS1C    = new THREE.MeshStandardMaterial({ map: s1cTex, roughness: 0.40, metalness: 0.1 });
    const matS2     = new THREE.MeshStandardMaterial({ map: s2Tex, roughness: 0.40, metalness: 0.1 });
    const matS4B    = new THREE.MeshStandardMaterial({ map: s4bTex, roughness: 0.35, metalness: 0.1 });
    const matCSM    = new THREE.MeshStandardMaterial({ map: csmTex, roughness: 0.30, metalness: 0.4 });
    const matCM     = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.20, metalness: 0.85 });
    const matEngine = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.25, metalness: 0.9 });
    const matMetal  = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.25, metalness: 0.85 });

    // 1. TORRE DE ESCAPE (LES)
    {
      const cover = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.78, 1.4, 24), matWhite);
      cover.position.y = 15.5;
      rocket.add(cover);

      for(let i=0; i<4; i++) {
        const ang = (i * Math.PI) / 2 + Math.PI/4;
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.8), matWhite);
        leg.position.set(Math.cos(ang)*0.28, 17.6, Math.sin(ang)*0.28);
        rocket.add(leg);
      }

      const motorBody = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 2.2, 16), matWhite);
      motorBody.position.y = 19.9;
      rocket.add(motorBody);

      for(let i=0; i<4; i++) {
        const ang = (i * Math.PI) / 2;
        const noz = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 12), matEngine);
        noz.position.set(Math.cos(ang)*0.18, 18.9, Math.sin(ang)*0.18);
        noz.rotation.z = Math.cos(ang) * 0.45;
        noz.rotation.x = Math.sin(ang) * -0.45;
        rocket.add(noz);
      }

      const noseTip = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.9, 16), matMetal);
      noseTip.position.y = 21.45;
      rocket.add(noseTip);
    }

    // 2. MÓDULO DE MANDO Y SERVICIO (CSM Columbia)
    {
      const cm = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 1.15, 1.1, 32), matCM);
      cm.position.y = 14.35;
      rocket.add(cm);

      const sm = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 1.8, 32), matCSM);
      sm.position.y = 12.80;
      rocket.add(sm);
    }

    // 3. ADAPTADOR SLA & ETAPA S-IVB
    {
      const slaCone = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.95, 2.5, 32, 1, true), matS4B);
      slaCone.position.y = 10.65;
      rocket.add(slaCone);

      const iuRing = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 0.4, 32), matWhite);
      iuRing.position.y = 9.20;
      rocket.add(iuRing);

      const s4bBody = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 3.8, 32), matS4B);
      s4bBody.position.y = 7.10;
      rocket.add(s4bBody);
    }

    // 4. SEGUNDA ETAPA (S-II)
    {
      const interstageCone = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 3.0, 1.8, 32, 1, true), matS2);
      interstageCone.position.y = 4.30;
      rocket.add(interstageCone);

      const s2Body = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.0, 6.2, 32), matS2);
      s2Body.position.y = 0.30;
      rocket.add(s2Body);
    }

    // 5. PRIMERA ETAPA (S-IC)
    {
      const s1Body = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.0, 13.0, 32), matS1C);
      s1Body.position.y = -9.30;
      rocket.add(s1Body);

      // 4 Aletas estabilizadoras
      for(let f=0; f<4; f++) {
        const ang = (f * Math.PI) / 2;
        const finGroup = new THREE.Group();
        finGroup.position.set(Math.cos(ang)*3.0, -14.8, Math.sin(ang)*3.0);
        finGroup.rotation.y = -ang;

        const fairing = new THREE.Mesh(new THREE.ConeGeometry(0.95, 2.8, 16), matWhite);
        fairing.position.set(0.65, -0.2, 0);
        finGroup.add(fairing);

        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0);
        finShape.lineTo(1.8, -1.8);
        finShape.lineTo(1.8, -2.6);
        finShape.lineTo(0, -2.4);
        finShape.closePath();

        const extSettings = { depth: 0.08, bevelEnabled: false };
        const finGeo = new THREE.ExtrudeGeometry(finShape, extSettings);
        const finMesh = new THREE.Mesh(finGeo, matWhite);
        finMesh.position.set(0.65, 0.4, -0.04);
        finGroup.add(finMesh);

        rocket.add(finGroup);
      }

      // 5 Motores F-1
      const f1Offsets = [
        [0, 0],
        [-1.65, 0],
        [ 1.65, 0],
        [0, -1.65],
        [0,  1.65]
      ];
      f1Offsets.forEach(([fx, fz]) => {
        const f1Bell = new THREE.Mesh(new THREE.ConeGeometry(1.05, 2.5, 32, 1, true), matEngine);
        f1Bell.position.set(fx, -16.8, fz);
        rocket.add(f1Bell);

        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.05, 8, 32), matMetal);
        ring.rotation.x = Math.PI/2;
        ring.position.set(fx, -18.0, fz);
        rocket.add(ring);
      });
    }

    // ── 5. Llamas Volumétricas de los 5 Motores F-1 ──────────────────────────
    const flameGroup = new THREE.Group();
    rocket.add(flameGroup);
    flameGroup.visible = false;

    const flameMatInner = new THREE.MeshBasicMaterial({ color: 0xffedd5, transparent: true, opacity: 0.90, blending: THREE.AdditiveBlending });
    const flameMatOuter = new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });

    const f1Flames = [];
    [
      [0, 0],
      [-1.65, 0],
      [ 1.65, 0],
      [0, -1.65],
      [0,  1.65]
    ].forEach(([fx, fz]) => {
      const coneInner = new THREE.Mesh(new THREE.ConeGeometry(0.85, 9.5, 20), flameMatInner);
      coneInner.position.set(fx, -22.5, fz);
      coneInner.rotation.x = Math.PI;
      flameGroup.add(coneInner);

      const coneOuter = new THREE.Mesh(new THREE.ConeGeometry(1.45, 14.0, 20), flameMatOuter);
      coneOuter.position.set(fx, -24.8, fz);
      coneOuter.rotation.x = Math.PI;
      flameGroup.add(coneOuter);

      f1Flames.push({ inner: coneInner, outer: coneOuter });
    });

    // ── 6. Controles y Cámaras Cinemáticas ──────────────────────────────────
    let isIgnited = false;
    let isRotating = true;

    const btnIgnite = document.getElementById('btn-ignite');
    btnIgnite.addEventListener('click', () => {
      isIgnited = !isIgnited;
      flameGroup.visible = isIgnited;
      btnIgnite.classList.toggle('active', isIgnited);
      btnIgnite.innerHTML = isIgnited ? '🔥 Motores F-1 Encendidos' : '🔥 Encender Motores F-1';
      engineLight.intensity = isIgnited ? 5.5 : 0;
    });

    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.classList.add('active');
    btnRotate.addEventListener('click', () => {
      isRotating = !isRotating;
      btnRotate.classList.toggle('active', isRotating);
    });

    const camViews = {
      global:  { pos: [24, 4, 30],   target: [0, 1.5, 0] },
      apollo:  { pos: [5, 16, 7],    target: [0, 15, 0] },
      s2:      { pos: [14, 4, 16],   target: [0, 4, 0] },
      engines: { pos: [8, -16, 11],  target: [0, -16, 0] }
    };

    let targetCamPos = camera.position.clone();
    let targetLookAt = controls.target.clone();
    let isTransitioning = false;

    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const v = camViews[btn.getAttribute('data-cam')];
        if (v) {
          targetCamPos.set(...v.pos);
          targetLookAt.set(...v.target);
          isTransitioning = true;
        }
      });
    });

    // ── 7. Bucle de Animación y Render ─────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      if (isRotating) {
        rocket.rotation.y += 0.08 * dt;
      }

      if (isIgnited) {
        engineLight.intensity = 4.5 + Math.sin(time * 30.0) * 1.2;
        f1Flames.forEach((f, idx) => {
          const jitter = Math.sin(time * 26.0 + idx) * 0.15;
          f.inner.scale.set(1.0 + jitter * 0.2, 1.0 + jitter, 1.0 + jitter * 0.2);
          f.outer.scale.set(1.0 + jitter * 0.3, 1.0 + jitter * 1.2, 1.0 + jitter * 0.3);
        });
      }

      if (isTransitioning) {
        camera.position.lerp(targetCamPos, 0.06);
        controls.target.lerp(targetLookAt, 0.06);
        if (camera.position.distanceTo(targetCamPos) < 0.1) {
          isTransitioning = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
