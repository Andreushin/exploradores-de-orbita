<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Atlas-Agena D - Despiece Interactivo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* HUD Superior */
    #hud {
      position: fixed; top: 24px; left: 28px;
      z-index: 10; pointer-events: none;
    }
    .hud-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 9999px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 9px; letter-spacing: 0.18em;
      color: #bae6fd; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .hud-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #38bdf8; box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 24px; font-weight: 800;
      color: #f8fafc; letter-spacing: -0.02em;
    }
    .hud-sub {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.15em; margin-top: 2px;
    }

    /* Panel de Telemetría de la Etapa */
    #info-card {
      position: fixed; right: 28px; top: 28px; width: 340px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      z-index: 20;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      transform: translateX(380px);
      opacity: 0;
      pointer-events: auto;
    }
    #info-card.visible { transform: translateX(0); opacity: 1; }
    .info-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    .info-tag {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 9px; letter-spacing: 0.15em; color: #38bdf8; text-transform: uppercase;
    }
    .info-name { font-size: 18px; font-weight: 700; color: #fff; margin-top: 2px; }
    .info-close {
      cursor: pointer; background: rgba(255,255,255,0.1); border: none;
      color: #fff; width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: background 0.2s;
    }
    .info-close:hover { background: rgba(255,255,255,0.25); }
    .info-desc { font-size: 12px; line-height: 1.5; color: #cbd5e1; margin-bottom: 14px; }
    .info-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .spec-item {
      background: rgba(0,0,0,0.3); border-radius: 6px; padding: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .spec-label {
      font-family: 'SF Mono', Consolas, monospace; font-size: 8px;
      color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em;
    }
    .spec-val { font-size: 12px; font-weight: 600; color: #f8fafc; margin-top: 2px; }

    /* Barra de Control Inferior */
    #controls-bar {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 40px;
      z-index: 15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-label {
      font-family: 'SF Mono', Consolas, monospace; font-size: 10px;
      color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.1em;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 140px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%; background: #38bdf8;
      cursor: pointer; box-shadow: 0 0 10px #38bdf8;
    }
    .btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 7px 15px; border-radius: 20px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(56,189,248,0.3); border-color: #38bdf8; }
    .btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 700; box-shadow: 0 0 15px rgba(2,132,199,0.6); }

    /* Lista lateral rápida de partes */
    #parts-menu {
      position: fixed; left: 28px; top: 120px;
      z-index: 10; display: flex; flex-direction: column; gap: 6px;
    }
    .part-pill {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px; border-radius: 8px;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 9px; letter-spacing: 0.1em;
      color: #cbd5e1; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .part-pill:hover, .part-pill.active {
      background: rgba(2, 132, 199, 0.4);
      border-color: #38bdf8; color: #fff;
      transform: translateX(4px);
    }
    .part-pill-dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; }
    .part-pill.active .part-pill-dot { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="hud">
    <div class="hud-badge"><span class="hud-dot"></span> NASA · CAD EXPLODED VIEW</div>
    <div class="hud-title">Atlas-Agena D</div>
    <div class="hud-sub">DESPIECE POR ETAPAS · VEHÍCULO OBJETIVO GEMINI (ATV)</div>
  </div>

  <div id="parts-menu">
    <div class="part-pill" onclick="showPartInfo('fairing')"><span class="part-pill-dot"></span>1. Cofia Aerodinámica</div>
    <div class="part-pill active" onclick="showPartInfo('agena')"><span class="part-pill-dot"></span>2. Vehículo Objetivo Agena D</div>
    <div class="part-pill" onclick="showPartInfo('interstage')"><span class="part-pill-dot"></span>3. Interetapa Damero</div>
    <div class="part-pill" onclick="showPartInfo('tank')"><span class="part-pill-dot"></span>4. Tanque Atlas SLV-3</div>
    <div class="part-pill" onclick="showPartInfo('skirt')"><span class="part-pill-dot"></span>5. Faldón Desechable Booster</div>
  </div>

  <div id="info-card">
    <div class="info-header">
      <div>
        <div class="info-tag" id="card-tag">ETAPA SUPERIOR</div>
        <div class="info-name" id="card-name">Agena D Target Vehicle</div>
      </div>
      <button class="info-close" onclick="closeCard()">✕</button>
    </div>
    <div class="info-desc" id="card-desc">Cargando telemetría...</div>
    <div class="info-specs" id="card-specs"></div>
  </div>

  <div id="controls-bar">
    <div class="slider-container">
      <span class="slider-label">Despiece:</span>
      <input type="range" id="explode-slider" min="0" max="1" step="0.01" value="0.55">
    </div>
    <button id="btn-auto" class="btn">⚡ Separación Auto</button>
    <button id="btn-reset" class="btn">🎯 Reset Cámara</button>
  </div>

  <script>
    // ── 1. Configuración de Escena WebGL ────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.007);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(22, 2, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.5, 0);
    controls.maxDistance = 90;
    controls.minDistance = 3;

    // ── 2. Iluminación Espacial ─────────────────────────────────────────────
    const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.6);
    sunLight.position.set(30, 25, 25);
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.85);
    fillLight.position.set(-25, -10, -20);
    scene.add(fillLight);

    const ambLight = new THREE.AmbientLight(0x0f172a, 0.6);
    scene.add(ambLight);

    // Fondo estelar
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 1200;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 500;
      starPos[i+1] = (Math.random() - 0.5) * 500;
      starPos[i+2] = (Math.random() - 0.5) * 500;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.85 });
    scene.add(new THREE.Points(starsGeo, starsMat));

    // ── 3. Generación Procedural de Texturas HD ─────────────────────────────
    function createTexture(width, height, drawFn) {
      const cv = document.createElement('canvas');
      cv.width = width; cv.height = height;
      const ctx = cv.getContext('2d');
      drawFn(ctx, width, height);
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function drawFlag(ctx, x, y, w, h) {
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(x, y, w, h);
      const stripeH = h / 13;
      ctx.fillStyle = '#ffffff';
      for(let i = 1; i < 13; i += 2) {
        ctx.fillRect(x, y + i * stripeH, w, stripeH);
      }
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(x, y, w * 0.42, stripeH * 7);
      ctx.fillStyle = '#ffffff';
      for(let r = 0; r < 3; r++) {
        for(let c = 0; c < 4; c++) ctx.fillRect(x + 4 + c * 8, y + 3 + r * 6, 2, 2);
      }
    }

    const atlasTankTex = createTexture(1024, 2048, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, '#94a3b8');
      grad.addColorStop(0.25, '#cbd5e1');
      grad.addColorStop(0.5, '#f1f5f9');
      grad.addColorStop(0.75, '#cbd5e1');
      grad.addColorStop(1, '#94a3b8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(71, 85, 105, 0.35)';
      ctx.lineWidth = 2;
      for(let y = 0; y < h; y += 45) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)';
      ctx.lineWidth = 3;
      for(let x = 0; x < w; x += 256) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 44px Arial, Helvetica, sans-serif';
      ctx.letterSpacing = '10px';
      const textX1 = 340;
      const textX2 = 852;
      const letters = ['U','N','I','T','E','D',' ','S','T','A','T','E','S'];
      letters.forEach((l, idx) => {
        if(l !== ' ') {
          ctx.fillText(l, textX1, 580 + idx * 75);
          ctx.fillText(l, textX2, 580 + idx * 75);
        }
      });

      ctx.fillStyle = '#dc2626';
      ctx.fillRect(textX1 - 30, 1680, 45, 30);
      ctx.fillRect(textX2 - 30, 1680, 45, 30);
    });

    const skirtTex = createTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(0, 0, w, h);
      for(let x = 0; x < w; x += 10) {
        ctx.fillStyle = (x % 20 === 0) ? '#64748b' : '#cbd5e1';
        ctx.fillRect(x, 0, 5, h);
      }
      ctx.fillStyle = '#475569';
      for(let x = 60; x < w; x += 256) {
        ctx.fillRect(x, 120, 120, 180);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, 120, 120, 180);
      }
    });

    const interstageTex = createTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      const rows = 2;
      const cols = 24;
      const cellW = w / cols;
      const cellH = 65;
      const startY = 220;

      for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
          if((r + c) % 2 === 0) {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(c * cellW, startY + r * cellH, cellW, cellH);
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(c * cellW, startY + r * cellH, cellW, cellH);
          }
        }
      }

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, startY); ctx.lineTo(w, startY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, startY + rows * cellH); ctx.lineTo(w, startY + rows * cellH); ctx.stroke();
    });

    const agenaTex = createTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 0, w, h);

      for(let x = 0; x < w; x += 12) {
        ctx.fillStyle = (x % 24 === 0) ? '#94a3b8' : '#cbd5e1';
        ctx.fillRect(x, 0, 6, 240);
      }

      drawFlag(ctx, 360, 260, 110, 65);
      drawFlag(ctx, 870, 260, 110, 65);

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('AGENA D · ATV-5003', 320, 360);
      ctx.fillText('AGENA D · ATV-5003', 830, 360);
    });

    // ── 4. Materiales PBR ───────────────────────────────────────────────────
    const matSteel  = new THREE.MeshStandardMaterial({ map: atlasTankTex, roughness: 0.22, metalness: 0.88 });
    const matSkirt  = new THREE.MeshStandardMaterial({ map: skirtTex, roughness: 0.35, metalness: 0.65 });
    const matInter  = new THREE.MeshStandardMaterial({ map: interstageTex, roughness: 0.40, metalness: 0.25 });
    const matAgena  = new THREE.MeshStandardMaterial({ map: agenaTex, roughness: 0.30, metalness: 0.40 });
    const matWhite  = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.15 });
    const matDark   = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.50, metalness: 0.30 });
    const matEngine = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.25, metalness: 0.90 });
    const matMetal  = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.20, metalness: 0.85 });
    const matCopper = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.35, metalness: 0.75 });

    // ── 5. Construcción de Grupos Modulares del Despiece ────────────────────
    const root = new THREE.Group();
    scene.add(root);

    const parts = {};

    // 1. COFIA PROTECTORA (PAYLOAD FAIRING)
    const grpFairing = new THREE.Group();
    grpFairing.userData = { id: 'fairing', name: 'Cofia Aerodinámica', tag: 'PROTECCIÓN ATMOSFÉRICA' };
    {
      const fairing = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.76, 2.4, 32), matWhite);
      fairing.position.y = 1.2;
      grpFairing.add(fairing);

      const noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 8, 0, Math.PI*2, 0, Math.PI/2), matWhite);
      noseTip.position.y = 2.4;
      grpFairing.add(noseTip);
    }
    grpFairing.userData.baseY = 11.6;
    grpFairing.userData.explodedY = 19.5;
    root.add(grpFairing);
    parts.fairing = grpFairing;

    // 2. VEHÍCULO OBJETIVO AGENA D (AGENA TARGET VEHICLE - ATV)
    const grpAgena = new THREE.Group();
    grpAgena.userData = { id: 'agena', name: 'Vehículo Objetivo Agena D', tag: 'ACOPLAMIENTO TRIPULADO GEMINI' };
    {
      // Cono de Acoplamiento y Adaptador TDA
      const dockingRing = new THREE.Mesh(new THREE.CylinderGeometry(0.74, 0.76, 0.5, 32), matDark);
      dockingRing.position.y = 1.85;
      grpAgena.add(dockingRing);

      // Cilindro principal de Agena D
      const agenaBody = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.76, 3.2, 32), matAgena);
      grpAgena.add(agenaBody);

      // 4 Antenas de aproximación por radar
      for(let i=0; i<4; i++) {
        const ang = (i * Math.PI) / 2 + Math.PI/4;
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.45), matMetal);
        ant.position.set(Math.cos(ang)*0.82, 1.3, Math.sin(ang)*0.82);
        ant.rotation.z = Math.cos(ang) * 0.4;
        ant.rotation.x = Math.sin(ang) * 0.4;
        grpAgena.add(ant);
      }

      // Motor Bell 8096 (XLR81) hipergólico de reencendido en el vacío
      const agenaEngine = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1.1, 20, 1, true), matEngine);
      agenaEngine.position.y = -2.15;
      grpAgena.add(agenaEngine);
    }
    grpAgena.userData.baseY = 9.5;
    grpAgena.userData.explodedY = 14.5;
    root.add(grpAgena);
    parts.agena = grpAgena;

    // 3. INTERETAPA ATLAS-AGENA (DAMERO BLANCO Y NEGRO)
    const grpInter = new THREE.Group();
    grpInter.userData = { id: 'interstage', name: 'Interetapa Atlas-Agena', tag: 'SEPARACIÓN DE ETAPAS' };
    {
      const interCone = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 1.25, 2.2, 32), matInter);
      grpInter.add(interCone);

      // Domo superior LOX de la etapa inferior
      const topDome = new THREE.Mesh(new THREE.SphereGeometry(0.74, 24, 12, 0, Math.PI*2, 0, Math.PI/2), matMetal);
      topDome.position.y = 1.0;
      grpInter.add(topDome);
    }
    grpInter.userData.baseY = 6.8;
    grpInter.userData.explodedY = 9.8;
    root.add(grpInter);
    parts.interstage = grpInter;

    // 4. TANQUE PRINCIPAL ATLAS SLV-3 (BALLOON TANK)
    const grpTank = new THREE.Group();
    grpTank.userData = { id: 'tank', name: 'Tanque Atlas SLV-3', tag: 'ETAPA Y MEDIA (STAGE 1.5)' };
    {
      // Cono de unión superior
      const atlasCone = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.52, 2.4, 32), matSteel);
      atlasCone.position.y = 6.1;
      grpTank.add(atlasCone);

      // Cilindro principal de acero inoxidable
      const atlasBody = new THREE.Mesh(new THREE.CylinderGeometry(1.52, 1.52, 9.8, 32), matSteel);
      grpTank.add(atlasBody);

      // Tuberías externas de cableado y LOX (Side Conduits)
      [-1.53, 1.53].forEach(x => {
        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 11.2), matMetal);
        pipe.position.set(x, 0.6, 0);
        grpTank.add(pipe);

        const pod = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.8, 0.16), matWhite);
        pod.position.set(x, -2.9, 0);
        grpTank.add(pod);
      });

      // Motor central Sustainer Rocketdyne XLR105 (permanece con el tanque)
      const sustainerBell = new THREE.Mesh(new THREE.ConeGeometry(0.40, 1.25, 24, 1, true), matEngine);
      sustainerBell.position.y = -5.5;
      grpTank.add(sustainerBell);
    }
    grpTank.userData.baseY = -1.6;
    grpTank.userData.explodedY = -0.5;
    root.add(grpTank);
    parts.tank = grpTank;

    // 5. FALDA DESECHABLE DE MOTORES BOOSTER (HALF-STAGE SKIRT)
    const grpSkirt = new THREE.Group();
    grpSkirt.userData = { id: 'skirt', name: 'Faldón Desechable Booster', tag: 'DESECHADO A T+130 SEGUNDOS' };
    {
      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(1.52, 1.76, 2.8, 32), matSkirt);
      grpSkirt.add(skirt);

      // Carenados de los dos motores Booster
      [-1.55, 1.55].forEach(x => {
        const fairing = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 2.8, 16), matSkirt);
        fairing.position.set(x, 0, 0);
        grpSkirt.add(fairing);
      });

      // 2 Motores Booster Rocketdyne XLR89
      [-0.95, 0.95].forEach(x => {
        const bell = new THREE.Mesh(new THREE.ConeGeometry(0.48, 1.4, 24, 1, true), matEngine);
        bell.position.set(x, -2.0, 0);
        grpSkirt.add(bell);

        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.03, 8, 24), matMetal);
        ring.rotation.x = Math.PI/2;
        ring.position.set(x, -2.7, 0);
        grpSkirt.add(ring);
      });

      // 2 Motores vernier
      [ [0, -1.6], [0, 1.6] ].forEach(([vx, vz]) => {
        const vernier = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 12, 1, true), matEngine);
        vernier.position.set(vx, -0.3, vz);
        vernier.rotation.x = vz > 0 ? 0.3 : -0.3;
        grpSkirt.add(vernier);
      });
    }
    grpSkirt.userData.baseY = -7.9;
    grpSkirt.userData.explodedY = -10.5;
    root.add(grpSkirt);
    parts.skirt = grpSkirt;

    // ── 6. Lógica de Explosión Armónica ─────────────────────────────────────
    let explosionFactor = 0.55;
    let isAutoExploding = false;
    let autoTime = 0;

    function applyExplosion(factor) {
      explosionFactor = factor;
      grpFairing.position.y    = THREE.MathUtils.lerp(grpFairing.userData.baseY, grpFairing.userData.explodedY, factor);
      grpAgena.position.y      = THREE.MathUtils.lerp(grpAgena.userData.baseY,   grpAgena.userData.explodedY,   factor);
      grpInter.position.y      = THREE.MathUtils.lerp(grpInter.userData.baseY,   grpInter.userData.explodedY,   factor);
      grpTank.position.y       = THREE.MathUtils.lerp(grpTank.userData.baseY,    grpTank.userData.explodedY,    factor);
      grpSkirt.position.y      = THREE.MathUtils.lerp(grpSkirt.userData.baseY,   grpSkirt.userData.explodedY,   factor);
    }

    applyExplosion(0.55);

    // ── 7. Base de Datos Histórica del Atlas-Agena D ────────────────────────
    const partData = {
      fairing: {
        tag: 'PROTECCIÓN AERODINÁMICA',
        name: 'Cofia Cónica / Nose Shroud',
        desc: 'Protector aerodinámico desechable que salvaguardaba el mecanismo de atraque del vehículo Agena D durante el ascenso atmosférico. En Gemini 9A, la cofia no se desprendió por completo, recibiendo el apodo de "Angry Alligator" (Caimán Furioso).',
        specs: [
          { label: 'ALTURA', val: '2.5 metros' },
          { label: 'MATERIAL', val: 'Fibra de vidrio y aluminio' },
          { label: 'APERTURA', val: 'Cilindros pirotécnicos' },
          { label: 'MISIÓN CLAVE', val: 'Gemini 8 / 9A / 10 / 11 / 12' }
        ]
      },
      agena: {
        tag: 'ETAPA SUPERIOR / TARGET',
        name: 'Vehículo Objetivo Agena D (ATV)',
        desc: 'El objetivo de atraque orbital definitivo del Proyecto Gemini. Con él, Neil Armstrong y David Scott realizaron en Gemini 8 el primer acoplamiento espacial de la historia de la humanidad.',
        specs: [
          { label: 'MOTOR', val: 'Bell 8096 (XLR81)' },
          { label: 'EMPUJE VACÍO', val: '71 kN (16,000 lbf)' },
          { label: 'PROPELENTE', val: 'UDMH + IRFNA (Hipergólico)' },
          { label: 'REENCENDIDOS', val: 'Múltiples en órbita' }
        ]
      },
      interstage: {
        tag: 'ADAPTADOR DE ACOPLE',
        name: 'Interetapa con Damero Blanco y Negro',
        desc: 'Estructura cónica de transición que acoplaba el tanque Atlas con la etapa Agena D. Su diseño en damero blanco y negro permitía a las cámaras ópticas terrestres medir con precisión la velocidad angular de giro y balanceo del cohete.',
        specs: [
          { label: 'PATRÓN', val: 'Roll Checkerboard (2 filas)' },
          { label: 'DIÁMETRO INF.', val: '3.05 m (Atlas)' },
          { label: 'DIÁMETRO SUP.', val: '1.52 m (Agena D)' },
          { label: 'FUNCIÓN', val: 'Referencia óptica y separación' }
        ]
      },
      tank: {
        tag: 'PRIMERA ETAPA Y MEDIA',
        name: 'Tanque Atlas SLV-3 (Balloon Tank)',
        desc: 'Obra maestra de ingeniería de Convair: fabricado con láminas de acero inoxidable tan delgadas como el papel que mantenían su forma y rigidez únicamente mediante la presurización interna de gases de helio y propelentes.',
        specs: [
          { label: 'DIÁMETRO', val: '3.05 metros' },
          { label: 'SUSTAINER', val: '1x Rocketdyne XLR105' },
          { label: 'EMPUJE CENTRAL', val: '254 kN (57,000 lbf)' },
          { label: 'PROPELENTE', val: 'RP-1 (Kerosene) + LOX' }
        ]
      },
      skirt: {
        tag: 'BOOSTER DESECHABLE',
        name: 'Faldón Desechable de Motores Booster',
        desc: 'Arquitectura única "Stage and a Half" (Etapa y Media). A los 130 segundos tras el despegue, el faldón de popa con los 2 motores auxiliares XLR89 se eyectaba, aligerando el peso mientras el motor sustainer central continuaba acelerando.',
        specs: [
          { label: 'MOTORES BOOST.', val: '2x Rocketdyne XLR89' },
          { label: 'EMPUJE BOOSTER', val: '1,476 kN (330,000 lbf)' },
          { label: 'MOTORES VERNIER', val: '2x LR101 (Control actitud)' },
          { label: 'EYECCIÓN', val: 'T+130 segundos (Mach 5+)' }
        ]
      }
    };

    function showPartInfo(id) {
      const data = partData[id];
      if (!data) return;

      document.querySelectorAll('.part-pill').forEach(p => p.classList.remove('active'));
      const activePill = Array.from(document.querySelectorAll('.part-pill')).find(p => p.getAttribute('onclick').includes(id));
      if (activePill) activePill.classList.add('active');

      document.getElementById('card-tag').innerText = data.tag;
      document.getElementById('card-name').innerText = data.name;
      document.getElementById('card-desc').innerText = data.desc;

      const specsBox = document.getElementById('card-specs');
      specsBox.innerHTML = '';
      data.specs.forEach(s => {
        const item = document.createElement('div');
        item.className = 'spec-item';
        item.innerHTML = `<div class="spec-label">${s.label}</div><div class="spec-val">${s.val}</div>`;
        specsBox.appendChild(item);
      });

      const card = document.getElementById('info-card');
      card.classList.add('visible');
    }

    function closeCard() {
      document.getElementById('info-card').classList.remove('visible');
      document.querySelectorAll('.part-pill').forEach(p => p.classList.remove('active'));
    }

    // Interacción por Raycaster (Clic en pieza 3D)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if (e.target.closest('#info-card') || e.target.closest('#controls-bar') || e.target.closest('#parts-menu')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(root.children, true);
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== root) {
          if (obj.userData && obj.userData.id) break;
          obj = obj.parent;
        }
        if (obj.userData && obj.userData.id) {
          showPartInfo(obj.userData.id);
        }
      }
    });

    // Control deslizante
    const slider = document.getElementById('explode-slider');
    slider.addEventListener('input', (e) => {
      isAutoExploding = false;
      document.getElementById('btn-auto').classList.remove('active');
      applyExplosion(parseFloat(e.target.value));
    });

    const btnAuto = document.getElementById('btn-auto');
    btnAuto.addEventListener('click', () => {
      isAutoExploding = !isAutoExploding;
      btnAuto.classList.toggle('active', isAutoExploding);
    });

    const btnReset = document.getElementById('btn-reset');
    btnReset.addEventListener('click', () => {
      controls.target.set(0, 1.5, 0);
      camera.position.set(22, 2, 26);
      controls.update();
    });

    showPartInfo('agena');

    // ── 8. Bucle de Animación y Renderizado ─────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (isAutoExploding) {
        autoTime += dt * 0.7;
        const val = (Math.sin(autoTime) + 1) * 0.5;
        slider.value = val;
        applyExplosion(val);
      }

      root.rotation.y += 0.07 * dt;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
