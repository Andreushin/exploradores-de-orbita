<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploradores de Órbita</title>
  <meta name="description" content="Space Mission Design Game — NASA Space Apps 2026">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens/mission.css">
  <link rel="stylesheet" href="css/screens/workshop.css">
  <link rel="stylesheet" href="css/screens/journey.css">

</head>
<body>
  <!-- OWNER: Rol 1. Las pantallas generan su propio DOM dentro de cada <section>. -->
  <header class="app-header">
    <div class="brand">🚀 <span data-i18n="common.appName"></span></div>
    <nav class="steps" id="steps"></nav>

      <span class="pill" id="hud-budget"></span>
      <button class="btn btn-ghost" id="lang-toggle" type="button">EN</button>
    </div>
  </header>

  <main id="app">
    <section class="screen" id="screen-mission" hidden></section>
    <section class="screen" id="screen-workshop" hidden></section>
    <section class="screen" id="screen-journey" hidden></section>
    <section class="screen" id="screen-report" hidden></section>
  </main>

  <footer class="app-footer" data-i18n="common.footer"></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
