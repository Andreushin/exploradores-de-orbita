<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploradores de Órbita</title>
  <meta name="description" content="Space Mission Design Game — NASA Space Apps 2026">
  <meta name="theme-color" content="#070b1a">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens/menu.css">
  <!-- Los CSS de cada nivel se cargan al abrirlo (js/levels.js). -->
</head>
<body>
  <a class="skip-link" href="#app" data-i18n="common.skip"></a>
  <!-- OWNER: Rol 1. Las pantallas generan su propio DOM dentro de cada <section>. -->
  <header class="app-header">
    <button class="brand" type="button"><img src="assets/logo.svg" alt="" width="32" height="32"><span data-i18n="common.appName"></span></button>
    <nav class="steps" id="steps" hidden></nav>
    <div class="header-right">
      <span class="pill" id="hud-budget" hidden></span>
      <button class="btn btn-ghost" id="nav-levels" type="button" data-i18n="common.levelsNav" hidden></button>
      <button class="btn btn-ghost" id="lang-toggle" type="button">EN</button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="error" id="app-error" role="alert" hidden></p>
    <section class="screen" id="screen-start" hidden></section>
    <section class="screen" id="screen-levels" hidden></section>
    <section class="screen" id="screen-mission" hidden></section>
    <section class="screen" id="screen-report" hidden></section>
  </main>

  <footer class="app-footer" data-i18n="common.footer"></footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
