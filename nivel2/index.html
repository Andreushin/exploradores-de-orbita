<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- OWNER: Rol 3 (@JU4NMAX) — Nivel 2 · Taller del CubeSat (docs/niveles/nivel-2.md). Página aislada. -->
  <title>Nivel 2 · Exploradores de Órbita</title>
  <meta name="theme-color" content="#070b1a">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="nivel2.css">
</head>
<body class="n2">
  <a class="n2-skip" id="n2-skip" href="#n2-main"></a>

  <!-- ── Barra superior 48 px ────────────────────────────────── -->
  <header class="n2-topbar">
    <a class="n2-brand" id="n2-menu" href="../">
      <img src="../assets/logo.svg" alt="" width="24" height="24">
      <span class="n2-brand-txt" id="n2-brand-name">Exploradores de Órbita</span>
    </a>
    <span class="n2-level-badge">2 / 4</span>
    <p class="n2-topbar-obj" id="n2-topbar-obj" aria-live="polite"></p>
    <button class="n2-topbar-btn" id="n2-lang" type="button">EN</button>
    <button class="n2-topbar-btn" id="n2-reset" type="button" title="Reiniciar">↺</button>
  </header>

  <!-- ── Avisos flotantes ────────────────────────────────────── -->
  <div class="n2-toasts" aria-live="polite">
    <p class="n2-toast n2-toast-demo"  id="n2-demo"   hidden></p>
    <p class="n2-toast n2-toast-warn"  id="n2-notice" role="status" hidden></p>
    <p class="n2-toast n2-toast-undo"  id="n2-undo"   hidden></p>
  </div>

  <!-- ── Workspace: 3 columnas ──────────────────────────────── -->
  <main class="n2-workspace" id="n2-main" tabindex="-1">
    <h1 class="n2-sr" id="n2-title"></h1>

    <!-- Col izquierda: catálogo con scroll propio -->
    <section class="n2-col-catalog" id="n2-catalog" aria-label="Catálogo de piezas"></section>

    <!-- Col central: visor 3D — NUNCA scroll -->
    <div class="n2-col-viewer" id="n2-viewer" role="img" aria-label="Vista 3D del CubeSat ensamblado">
      <!-- Ventanal de la estación: fondo decorativo (CSS puro). Capas: estrellas 0 · planeta y piso 1 · brazos 2-5 · modelo 10 -->
      <div class="n2-bay" aria-hidden="true">
        <i class="n2-bay-planet"></i>
        <i class="n2-bay-rays"></i>
        <i class="n2-bay-floor"></i>
        <div class="n2-bay-arm n2-bay-arm-l"><i><b></b></i></div>
        <div class="n2-bay-arm n2-bay-arm-r"><i><b></b></i></div>
        <i class="n2-bay-dust"></i><i class="n2-bay-dust"></i><i class="n2-bay-dust"></i>
      </div>
      <div class="n2-scene" id="n2-scene">
        <div class="n2-fit" id="n2-fit"><div class="n2-tilt"><div class="n2-sat" id="n2-sat"></div></div></div>
      </div>
      <p class="n2-empty" id="n2-empty"></p>
      <p class="n2-hud" id="n2-hud" aria-live="polite"></p>
    </div>

    <!-- Col derecha: telemetría con scroll si hace falta -->
    <aside class="n2-col-telem" id="n2-telem" aria-label="Telemetría y verificaciones"></aside>

  </main>

  <!-- Celular: resumen fijo abajo (en escritorio la telemetría ya está a la vista) -->
  <div class="n2-mini" id="n2-mini"></div>

  <!-- Popover TRL (contenedor de popovers generados por JS) -->
  <div id="n2-pops" class="n2-pops"></div>

  <!-- Viñeta roja de pantalla completa (mismo efecto que el Nivel 1 al pasarse) -->
  <div class="n2-alarm" id="n2-alarm" aria-hidden="true"></div>

  <script type="module" src="nivel2.js"></script>
</body>
</html>
