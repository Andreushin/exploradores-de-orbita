<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- OWNER: Rol 3 (@JU4NMAX) — Nivel 2 · Taller del CubeSat (docs/niveles/nivel-2.md). Página aislada. -->
  <title>Nivel 2 · Exploradores de Órbita</title>
  <meta name="theme-color" content="#070b1a">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="nivel2.css">
</head>
<body class="n2">
  <header class="n2-header">
    <a class="n2-brand" id="n2-menu" href="../"><img src="../assets/logo.svg" alt="" width="28" height="28"><span id="n2-brand-name">Exploradores de Órbita</span></a>
    <span class="n2-level">2 / 4</span>
    <button class="n2-btn n2-btn-ghost" id="n2-lang" type="button">EN</button>
  </header>

  <main class="n2-main">
    <h1 id="n2-title"></h1>
    <p class="n2-lead" id="n2-lead"></p>
    <p class="n2-demo" id="n2-demo" hidden></p>
    <p class="n2-objective" id="n2-objective" hidden></p>
    <p class="n2-notice" id="n2-notice" role="status" hidden></p>

    <div class="n2-layout">
      <section class="n2-bench" id="n2-bench" aria-labelledby="n2-bench-title">
        <div class="n2-bench-head"><h2 id="n2-bench-title"></h2><span class="n2-bench-use" id="n2-bench-use"></span></div>
        <div class="n2-banco" id="n2-banco"></div>
        <ol class="n2-test-log" id="n2-test-log" aria-live="polite"></ol>
      </section>
      <section class="n2-catalog" id="n2-catalog"></section>
      <aside class="n2-panel" id="n2-panel"></aside>
    </div>
    <dialog class="n2-dialog" id="n2-dialog"></dialog>
  </main>

  <script type="module" src="nivel2.js"></script>
</body>
</html>
