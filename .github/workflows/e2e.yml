name: E2E checkpoint

# ⏸ En pausa hasta el cierre (H32): el flujo cambió con #45 y la prueba se adapta al final.
# Solo se corre a mano: Actions → E2E checkpoint → Run workflow. No bloquea PRs.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL a probar (vacío = servidor local del repo)"
        required: false
        default: "https://andreushin.github.io/exploradores-de-orbita/"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (3 misiones + idioma + móvil)
    # Fijo: Playwright 1.56 no soporta ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Correr pruebas
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
