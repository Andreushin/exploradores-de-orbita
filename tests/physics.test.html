<!doctype html>
<!-- OWNER: Rol 2 — abrir en http://localhost:8000/tests/physics.test.html -->
<html lang="es"><head><meta charset="utf-8"><title>Physics tests</title>
<style>body{font:14px monospace;background:#111;color:#ddd;padding:16px}.ok{color:#4ade80}.fail{color:#f87171}</style></head>
<body><h1>physics.js</h1><ul id="out"></ul>
<script type="module">
import * as p from '../js/physics.js';
const out = document.getElementById('out');
const check = (name, cond) => { const li = document.createElement('li'); li.className = cond ? 'ok' : 'fail'; li.textContent = (cond ? 'PASS ' : 'FAIL ') + name; out.append(li); };
const load = (f) => fetch(`../data/${f}.json`).then((r) => r.json());
const [missions, rockets, pieces] = await Promise.all(['missions', 'rockets', 'pieces'].map(load));
const data = { missions, rockets, pieces };

check('Tsiolkovsky 220 s, 12→10 kg ≈ 393 m/s', Math.abs(p.deltaV(220, 12, 10) - 393.4) < 1);
check('deltaV sin propelente = 0', p.deltaV(220, 10, 10) === 0);
check('insertion orbit', p.insertionOutcome(1000, 1000) === 'orbit');
check('insertion flyby', p.insertionOutcome(500, 1000) === 'flyby');
check('insertion crash', p.insertionOutcome(1300, 1000) === 'crash');

const ref = {
  moon: ['pico', 'struct-6u', ['solar-body', 'battery', 'prop-green', 'comm-uhf', 'obc', 'inst-camera'], 2.5, 45],
  mars: ['medio', 'struct-12u', ['solar-deploy', 'solar-body', 'battery', 'prop-green', 'comm-x', 'adcs', 'obc', 'inst-camera', 'inst-mag'], 7, 60],
  europa: ['pesado', 'struct-12u', ['rtg-mini', 'solar-deploy', 'prop-ion', 'comm-x', 'obc', 'inst-mag', 'inst-camera'], 1.5, 85],
};
const design = (m, changes = {}) => {
  const [rocketId, formFactor, pieces, propellantKg, space] = ref[m];
  const d = { missionId: m, rocketId, budget: { space }, satellite: { formFactor, pieces: [...pieces], propellantKg } };
  if (changes.remove) d.satellite.pieces = d.satellite.pieces.filter((id) => !changes.remove.includes(id));
  if (changes.add) d.satellite.pieces.push(...changes.add);
  if ('formFactor' in changes) d.satellite.formFactor = changes.formFactor;
  if ('propellantKg' in changes) d.satellite.propellantKg = changes.propellantKg;
  if ('missionId' in changes) d.missionId = changes.missionId;
  if ('rocketId' in changes) d.rocketId = changes.rocketId;
  if ('space' in changes) d.budget.space = changes.space;
  return d;
};
const failed = (r) => r.checks.filter((c) => !c.ok).map((c) => c.id);

// Los 3 diseños ganadores deben pasar.
for (const m of Object.keys(ref)) {
  const r = p.validateDesign(design(m), data);
  check(`diseño de referencia ${m} es válido ${r.valid ? '' : '→ falla: ' + failed(r)}`, r.valid);
}

// Diseños inválidos: cada uno debe fallar justo en el check esperado.
const invalid = [
  ['exceso de masa (Luna con 6 kg de propelente en 6U)', 'moon', { propellantKg: 6 }, 'mass'],
  ['sin energía (Europa sin RTG)', 'europa', { remove: ['rtg-mini'] }, 'power'],
  ['sin radio (Marte sin banda X)', 'mars', { remove: ['comm-x'] }, 'comms'],
  ['radio sin alcance (UHF hacia Europa)', 'europa', { remove: ['comm-x'], add: ['comm-uhf'] }, 'comms'],
  ['sin Δv (Luna con 0.5 kg de propelente)', 'moon', { propellantKg: 0.5 }, 'deltaV'],
  ['sin propulsión (Luna sin motor)', 'moon', { remove: ['prop-green'], propellantKg: 0 }, 'propellant'],
  ['sin estructura', 'moon', { formFactor: null }, 'structure'],
  ['sin computadora de vuelo', 'moon', { remove: ['obc'] }, 'obc'],
  ['monopropelente sin batería', 'moon', { remove: ['battery'] }, 'battery'],
  ['sin instrumentos', 'moon', { remove: ['inst-camera'] }, 'science'],
  ['sin presupuesto (costo > segmento Espacio)', 'moon', { space: 10 }, 'cost'],
  ['exceso de volumen (diseño de Marte en 3U)', 'mars', { formFactor: 'struct-3u' }, 'volume'],
];
for (const [name, m, changes, expected] of invalid) {
  const r = p.validateDesign(design(m, changes), data);
  const ids = failed(r);
  check(`diseño inválido: ${name} → falla "${expected}" ${ids.includes(expected) ? '' : '(fallaron: ' + (ids.join(', ') || 'ninguno') + ')'}`, !r.valid && ids.includes(expected));
}
</script></body></html>
