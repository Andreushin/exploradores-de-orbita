<!doctype html>
<!-- OWNER: Rol 2 — abrir en http://localhost:8000/tests/physics.test.html -->
<html lang="es"><head><meta charset="utf-8"><title>Physics tests</title>
<style>body{font:14px monospace;background:#111;color:#ddd;padding:16px}.ok{color:#4ade80}.fail{color:#f87171}</style></head>
<body><h1>physics.js</h1><ul id="out"></ul>
<script type="module">
import * as p from '../js/physics.js';
const out = document.getElementById('out');
const check = (name, cond) => { const li = document.createElement('li'); li.className = cond ? 'ok' : 'fail'; li.textContent = (cond ? 'PASS ' : 'FAIL ') + name; out.append(li); };
const load = (f) => fetch(`../data/${f}.json`).then((r) => r.json());
const [missions, rockets, pieces] = await Promise.all(['missions', 'rockets', 'pieces'].map(load));
const data = { missions, rockets, pieces };

check('Tsiolkovsky 220 s, 12→10 kg ≈ 393 m/s', Math.abs(p.deltaV(220, 12, 10) - 393.4) < 1);
check('deltaV sin propelente = 0', p.deltaV(220, 10, 10) === 0);
check('insertion orbit', p.insertionOutcome(1000, 1000) === 'orbit');
check('insertion flyby', p.insertionOutcome(500, 1000) === 'flyby');
check('insertion crash', p.insertionOutcome(1300, 1000) === 'crash');

const ref = {
  moon: ['pico', 'struct-6u', ['battery', 'prop-green', 'comm-uhf', 'obc', 'inst-camera'], 2.5, 45],
  mars: ['medio', 'struct-12u', ['solar-deploy', 'battery', 'prop-green', 'comm-x', 'adcs', 'obc', 'inst-camera', 'inst-mag'], 7, 60],
  europa: ['pesado', 'struct-12u', ['rtg-mini', 'solar-deploy', 'prop-ion', 'comm-x', 'obc', 'inst-mag', 'inst-camera'], 1.5, 85],
};
const design = (m, changes = {}) => {
  const [rocketId, formFactor, pieces, propellantKg, space] = ref[m];
  const d = { missionId: m, rocketId, budget: { space }, satellite: { formFactor, pieces: [...pieces], propellantKg } };
  if (changes.remove) d.satellite.pieces = d.satellite.pieces.filter((id) => !changes.remove.includes(id));
  if (changes.add) d.satellite.pieces.push(...changes.add);
  if ('formFactor' in changes) d.satellite.formFactor = changes.formFactor;
  if ('propellantKg' in changes) d.satellite.propellantKg = changes.propellantKg;
  if ('missionId' in changes) d.missionId = changes.missionId;
  if ('rocketId' in changes) d.rocketId = changes.rocketId;
  if ('space' in changes) d.budget.space = changes.space;
  return d;
};
const failed = (r) => r.checks.filter((c) => !c.ok).map((c) => c.id);

// Los 3 diseños ganadores deben pasar.
for (const m of Object.keys(ref)) {
  const r = p.validateDesign(design(m), data);
  check(`diseño de referencia ${m} es válido ${r.valid ? '' : '→ falla: ' + failed(r)}`, r.valid);
}

// Modelo de energía: generación y consumo separados, neto que puede ser negativo, batería que guarda (no genera).
const near = (a, b) => Math.abs(a - b) < 1e-6;
const sat = (m, changes) => { const d = design(m, changes); return p.resolvePieces([d.satellite.formFactor, ...d.satellite.pieces].filter(Boolean), pieces); };
const moonPow = p.powerBalance(sat('moon'), 1);
check('Luna 6U: paneles de serie 8 W, consumo UHF 2 + OBC 1 + cámara 4 = 7 W, neto +1 W', near(moonPow.generated, 8) && near(moonPow.consumed, 7) && near(moonPow.net, 1));
check('cada pieza genera o consume, nunca ambas', pieces.every((x) => !(x.powerW < 0 && x.storageWh) && !(x.storageWh && x.powerW !== 0)));
check('la estructura trae paneles de serie ≈1.33 W por U (3U 4 W · 6U 8 W · 12U 16 W)', ['struct-3u', 'struct-6u', 'struct-12u'].every((id) => { const s = pieces.find((x) => x.id === id); return s.solar && near(-s.powerW, s.volumeU * 4 / 3); }));
const marsPow = p.powerBalance(sat('mars'), 1.52);
check(`Marte: los paneles dan solo ${(100 / 1.52 ** 2).toFixed(0)} % de la luz (16 W de serie + 36 W desplegables = 52 W → ${marsPow.generated.toFixed(1)} W)`, near(marsPow.generated, 52 / 1.52 ** 2));
const europaPow = p.powerBalance(sat('europa'), 5.2);
check(`Europa: el RTG (${europaPow.generatedNoSun} W) es casi toda la generación; los paneles dan ${(europaPow.generated - europaPow.generatedNoSun).toFixed(1)} W`, near(europaPow.generatedNoSun, 35) && europaPow.generated - europaPow.generatedNoSun < 2);
check('la batería no genera: con o sin ella, la generación y el neto son iguales', near(p.powerBalance(sat('moon', { remove: ['battery'] }), 1).net, moonPow.net));
const moonSto = p.energyStorage(sat('moon'), moonPow, 0.6);
check('Luna: la batería de 80 Wh usa la mitad (40 Wh) y debe cubrir eclipse 4.2 + quemados 20 Wh', near(moonSto.capacityWh, 80) && near(moonSto.usableWh, 40) && near(moonSto.eclipseWh, 4.2) && near(moonSto.burnWh, 20) && moonSto.neededWh <= moonSto.usableWh);
const rtgSto = p.energyStorage(sat('europa'), europaPow, 1.0);
check('Europa: el RTG sigue generando en el eclipse, no necesita batería', rtgSto.eclipseWh === 0 && rtgSto.neededWh === 0);
check('batería de 160 Wh suma a la de 80 Wh (240 Wh)', p.energyStorage(sat('moon', { add: ['battery-large'] }), moonPow, 0.6).capacityWh === 240);
const heavy = design('mars', { add: ['inst-radar', 'inst-spectro'], remove: ['inst-mag'] });
const heavyBig = design('mars', { add: ['inst-radar', 'inst-spectro', 'battery-large'], remove: ['inst-mag'] });
check('con la batería de 160 Wh el diseño hambriento de energía pasa el check "battery"', failed(p.validateDesign(heavy, data)).includes('battery') && !failed(p.validateDesign(heavyBig, data)).includes('battery'));
check('validateDesign expone metrics.power.net y metrics.storage', (() => { const x = p.validateDesign(design('moon'), data).metrics; return near(x.power.net, 1) && x.storage.capacityWh === 80; })());

// Diseños inválidos: cada uno debe fallar justo en el check esperado.
const invalid = [
  ['exceso de masa (Luna con 6 kg de propelente en 6U)', 'moon', { propellantKg: 6 }, 'mass'],
  ['sin energía (Europa sin RTG)', 'europa', { remove: ['rtg-mini'] }, 'power'],
  ['sin radio (Marte sin banda X)', 'mars', { remove: ['comm-x'] }, 'comms'],
  ['radio sin alcance (UHF hacia Europa)', 'europa', { remove: ['comm-x'], add: ['comm-uhf'] }, 'comms'],
  ['sin Δv (Luna con 0.5 kg de propelente)', 'moon', { propellantKg: 0.5 }, 'deltaV'],
  ['sin propulsión (Luna sin motor)', 'moon', { remove: ['prop-green'], propellantKg: 0 }, 'propellant'],
  ['sin estructura', 'moon', { formFactor: null }, 'structure'],
  ['sin computadora de vuelo', 'moon', { remove: ['obc'] }, 'obc'],
  ['monopropelente sin batería', 'moon', { remove: ['battery'] }, 'battery'],
  ['energía neta negativa (Luna con radar y sin paneles desplegables)', 'moon', { add: ['inst-radar'] }, 'power'],
  ['3U no llega a la potencia mínima de la Luna (4 W < 5 W)', 'moon', { formFactor: 'struct-3u' }, 'power'],
  ['Marte sin paneles desplegables (la luz cae a 43 %)', 'mars', { remove: ['solar-deploy'] }, 'power'],
  ['batería chica para instrumentos hambrientos (radar + espectrómetro en Marte)', 'mars', { add: ['inst-radar', 'inst-spectro'], remove: ['inst-mag'] }, 'battery'],
  ['sin instrumentos', 'moon', { remove: ['inst-camera'] }, 'science'],
  ['sin presupuesto (costo > segmento Espacio)', 'moon', { space: 10 }, 'cost'],
  ['exceso de volumen (diseño de Marte en 3U)', 'mars', { formFactor: 'struct-3u' }, 'volume'],
];
for (const [name, m, changes, expected] of invalid) {
  const r = p.validateDesign(design(m, changes), data);
  const ids = failed(r);
  check(`diseño inválido: ${name} → falla "${expected}" ${ids.includes(expected) ? '' : '(fallaron: ' + (ids.join(', ') || 'ninguno') + ')'}`, !r.valid && ids.includes(expected));
}
</script></body></html>
