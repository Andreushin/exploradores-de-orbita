<!doctype html>
<!-- OWNER: Rol 2 — abrir en http://localhost:8000/tests/physics.test.html -->
<html lang="es"><head><meta charset="utf-8"><title>Physics tests</title>
<style>body{font:14px monospace;background:#111;color:#ddd;padding:16px}.ok{color:#4ade80}.fail{color:#f87171}</style></head>
<body><h1>physics.js</h1><ul id="out"></ul>
<script type="module">
import * as p from '../js/physics.js';
const out = document.getElementById('out');
const check = (name, cond) => { const li = document.createElement('li'); li.className = cond ? 'ok' : 'fail'; li.textContent = (cond ? 'PASS ' : 'FAIL ') + name; out.append(li); };
const load = (f) => fetch(`../data/${f}.json`).then((r) => r.json());
const [missions, rockets, pieces] = await Promise.all(['missions', 'rockets', 'pieces'].map(load));
const data = { missions, rockets, pieces };

check('Tsiolkovsky 220 s, 12→10 kg ≈ 393 m/s', Math.abs(p.deltaV(220, 12, 10) - 393.4) < 1);
check('deltaV sin propelente = 0', p.deltaV(220, 10, 10) === 0);
check('insertion orbit', p.insertionOutcome(1000, 1000) === 'orbit');
check('insertion flyby', p.insertionOutcome(500, 1000) === 'flyby');
check('insertion crash', p.insertionOutcome(1300, 1000) === 'crash');

const ref = {
  moon: ['pico', 'struct-6u', ['solar-body', 'battery', 'prop-green', 'comm-uhf', 'obc', 'inst-camera'], 2.5, 45],
  mars: ['medio', 'struct-12u', ['solar-deploy', 'solar-body', 'battery', 'prop-green', 'comm-x', 'adcs', 'obc', 'inst-camera', 'inst-mag'], 6, 60],
  europa: ['pesado', 'struct-12u', ['rtg-mini', 'solar-deploy', 'prop-ion', 'comm-x', 'obc', 'inst-mag', 'inst-camera'], 1.5, 85],
};
for (const [m, [rocketId, ff, list, prop, space]] of Object.entries(ref)) {
  const r = p.validateDesign({ missionId: m, rocketId, budget: { space }, satellite: { formFactor: ff, pieces: list, propellantKg: prop } }, data);
  check(`diseño de referencia ${m} es válido ${r.valid ? '' : '→ falla: ' + r.checks.filter((c) => !c.ok).map((c) => c.id)}`, r.valid);
}
</script></body></html>
